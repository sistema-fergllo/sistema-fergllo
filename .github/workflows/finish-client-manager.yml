name: Finish client manager
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch client manager
        run: python3 scripts/patch_client_manager.py
      - name: Patch menu refinement
        run: python3 scripts/patch_menu_v2.py
      - name: Patch client auth rotation
        run: python3 scripts/patch_client_auth_rotation.py
      - name: Patch admin login
        run: python3 scripts/patch_admin_login_fix.py
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix manager login"
          git push
