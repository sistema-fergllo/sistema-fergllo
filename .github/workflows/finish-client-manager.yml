name: Faragello system verification

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required system features
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "chooseLogin('all')",
              "async function doLogin()",
              'id="navClients"',
              "client_accounts",
              "user_profiles",
              "تقرير الجرد",
              "printAllBarcodes",
              'src="login-fix.js',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Required system feature missing: " + ", ".join(missing))
          forbidden = [
              "للتواصل والاستفسار",
              "01128777287",
              "ensurePublicPhone",
              "faragello-public-phone",
              "chooseLogin('client')",
              'id="clientLoginToggle"',
          ]
          present = [item for item in forbidden if item in html]
          if present:
              raise SystemExit("Removed public/login elements still present: " + ", ".join(present))
          print("Required features are present and removed public/login elements are absent.")
          PY

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check login-fix.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I)
          count = 0
          for attrs, body in scripts:
              if re.search(r'\bsrc\s*=', attrs, re.I) or not body.strip():
                  continue
              count += 1
              Path(f"/tmp/faragello-inline-{count}.js").write_text(body, encoding="utf-8")
          if count == 0:
              raise SystemExit("No inline JavaScript blocks found.")
          print(f"Extracted {count} inline JavaScript blocks for syntax checking.")
          PY
          for file in /tmp/faragello-inline-*.js; do
            node --check "$file"
          done
          echo "All JavaScript syntax checks passed."

      - name: Request GitHub Pages rebuild
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
