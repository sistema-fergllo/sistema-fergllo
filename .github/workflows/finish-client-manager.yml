name: Faragello system verification

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cashier returns loader
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="returns.js?v=20261031"></script>'
          s = s.replace(tag, '')
          s = re.sub(r"(\+table\+)'\\n</body", r"\1'</body", s)
          s = re.sub(r"(\+table\+)'\n</body", r"\1'</body", s)
          pos = s.rfind('</body>')
          if pos < 0:
              raise SystemExit('Missing final </body> marker')
          s = s[:pos] + tag + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Install cashier returns loader"
            git push
          fi

      - name: Verify required system features
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "chooseLogin('admin')",
              "chooseLogin('client')",
              "async function doLogin()",
              'id="navClients"',
              "client_accounts",
              "user_profiles",
              "تقرير الجرد",
              "printAllBarcodes",
              'src="login-fix.js',
              'returns.js?v=20261031',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Required system feature missing: " + ", ".join(missing))
          print("Required system features are present.")
          PY

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check login-fix.js
          node --check returns.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I)
          count = 0
          for attrs, body in scripts:
              if re.search(r'\bsrc\s*=', attrs, re.I) or not body.strip():
                  continue
              count += 1
              Path(f"/tmp/faragello-inline-{count}.js").write_text(body, encoding="utf-8")
          if count == 0:
              raise SystemExit("No inline JavaScript blocks found.")
          print(f"Extracted {count} inline JavaScript blocks for syntax checking.")
          PY
          for file in /tmp/faragello-inline-*.js; do
            node --check "$file"
          done
          echo "All JavaScript syntax checks passed."

      - name: Request GitHub Pages rebuild
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
