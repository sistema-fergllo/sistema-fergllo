name: Finish client manager
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current system and sidebar labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
              "chooseLogin('admin')",
              "chooseLogin('client')",
              "async function doLogin()",
              "client_accounts",
              "user_profiles",
              "الاستعلامات اليومية",
              "التقارير اليومية",
              "تقارير الجرد",
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required system parts: '+', '.join(missing))
          print('Faragello System verification passed.')
          PY
