name: One-time supervisor color fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'one-time supervisor color fix trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply green supervisor color and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Farag El-Sayed • مشرف النظام'
          if old not in s:
              raise SystemExit('Supervisor text not found')
          s = s.replace(old, '<span id="faragello-supervisor-name">Farag El-Sayed • مشرف النظام</span>', 1)
          marker = '<style id="faragello-supervisor-green-fix">'
          css = marker + '\n#login #faragello-supervisor-name{color:#16a34a!important;font-weight:800!important;}\n</style>\n'
          if marker not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-green-supervisor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-green-supervisor.yml
          git commit -m 'تثبيت لون مشرف النظام بالأخضر في الواجهة الخارجية'
          git push
