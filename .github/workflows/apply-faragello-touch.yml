name: Faragello Touch Validation

on:
  push:
    branches: ["touch/2026-10-31"]

permissions:
  contents: read

jobs:
  validate-touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate touch JavaScript
        run: node --check faragello-touch.js
      - name: Verify visual assets
        run: test -f faragello-touch.css && test -f faragello-touch.js && test -f login-fix-legacy.js
