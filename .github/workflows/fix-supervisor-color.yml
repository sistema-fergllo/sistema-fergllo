name: Apply supervisor name color fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply supervisor name color fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace supervisor name color
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div style="margin-top:18px;color:#16834a;font-size:14px;font-weight:800"><span id="faragello-supervisor-name">Farag El-Sayed • مشرف النظام</span></div>'
          new = '<div style="margin-top:18px;color:#000;font-size:14px;font-weight:800"><span id="faragello-supervisor-name">Farag El-Sayed • مشرف النظام</span></div>'
          if old not in s:
              raise SystemExit('Target supervisor name block was not found.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-supervisor-color.yml
          git add index.html .github/workflows/fix-supervisor-color.yml
          git commit -m "Apply supervisor name color fix"
          git push
