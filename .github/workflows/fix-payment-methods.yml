name: Faragello payment methods fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cashier payment methods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<select id="pay"><option>كاش</option><option>فيزا</option><option>تحويل</option></select>'
          new = '<select id="pay"><option>كاش</option><option>إلكتروني</option></select>'
          if old not in s:
              raise SystemExit('Expected cashier payment selector was not found; no change made.')
          s = s.replace(old, new, 1)
          s = s.replace("if(pay==='فيزا'){shifts[k].wallets+=Number(x.total||0);}else if(pay!=='تحويل'&&pay!=='تحويل بنكي'){", "if(pay==='إلكتروني'){shifts[k].wallets+=Number(x.total||0);}else{")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary fixer
        run: |
          rm -f .github/workflows/fix-payment-methods.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-payment-methods.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Update cashier payment methods'
          git push
