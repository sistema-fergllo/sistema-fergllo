name: Fix shift summary cash revenue

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[cash-summary-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "shifts[k].count++;shifts[k].total+=Number(x.total||0);if(String(x.pay||'').trim()==='فيزا')shifts[k].wallets+=Number(x.total||0);"
          new = "shifts[k].count++;const pay=String(x.pay||'').trim();if(pay==='فيزا'){shifts[k].wallets+=Number(x.total||0);}else if(pay!=='تحويل'&&pay!=='تحويل بنكي'){shifts[k].total+=Number(x.total||0);}"
          if old not in s:
              raise SystemExit('Target code not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-cash-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-cash-summary.yml
          git commit -m "Fix shift summary cash-only revenue [cash-summary-fix]"
          git push