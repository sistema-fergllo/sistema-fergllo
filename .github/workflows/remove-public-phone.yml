name: Remove public contact phone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-contact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove public contact block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div id="faragello-public-phone"><div>للتواصل والاستفسار</div><a href="tel:01128777287" dir="ltr">01128777287</a></div>'
          if old in s:
              s = s.replace(old, '')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit removal
        run: |
          git config user.name "Faragello System"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "Remove public contact phone"
            git push
          fi

      - name: Remove this one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/remove-public-phone.yml
          git config user.name "Faragello System"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/remove-public-phone.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove one-time cleanup workflow"
          git push
