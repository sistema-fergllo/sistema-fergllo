name: Fix Faragello returns loader placement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix loader placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="returns.js?v=20261031"></script>'
          bad = "<script src=\"returns.js?v=20261031\"></script>\\n"
          s = s.replace(bad, '', 1)
          if tag not in s:
              marker = '</body>'
              pos = s.rfind(marker)
              if pos < 0:
                  raise SystemExit('Missing final </body> marker')
              s = s[:pos] + tag + '\n' + s[pos:]
          else:
              first = s.find(tag)
              last = s.rfind('</body>')
              if first > last:
                  s = s[:first] + s[first+len(tag):]
                  last = s.rfind('</body>')
                  s = s[:last] + tag + '\n' + s[last:]
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fix-returns-loader.yml').unlink(missing_ok=True)
          PY
      - name: Commit corrected placement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-returns-loader.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix cashier returns loader placement"
          git push
