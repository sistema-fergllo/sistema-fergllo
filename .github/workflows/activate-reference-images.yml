name: Activate Faragello reference design
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reference design assets and stylesheet
        run: |
          test -f force-design.css
          test -f index.html
          grep -q 'force-design.css' index.html
          echo "Reference design files verified."
