name: Update sidebar icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace sidebar icons only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('<div class="layout"><aside class="side">')
          b=s.index('</aside><main>', a)
          new='''<div class="layout"><aside class="side">\n  <button class="nav active" data-page="home" onclick="showPage('home')"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>الرئيسية</button>\n  <button class="nav" data-page="coding" onclick="showPage('coding')"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM7 8h10v2H7zm0 4h6v2H7zm0 4h8v1H7z"/></svg></span>التكويدات</button>\n  <button class="nav" data-page="cashier" onclick="requestPage('cashier')"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 8h16v11H4zM7 5h10v3H7zm2 7h2v2H9zm4 0h2v2h-2zm-4 3h6v2H9z"/></svg></span>الكاشير</button>\n  <button class="nav" data-page="sales" onclick="showPage('sales')"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19V9h3v10zm6 0V5h3v14zm6 0V2h3v17zM3 21h18v1H3z"/></svg></span>المبيعات</button>\n  <button class="nav" data-page="reports" onclick="showPage('reports')"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5zm10 1v4h4M8 11h8v2H8zm0 4h8v2H8z"/></svg></span>التقارير</button>\n  <button class="nav" data-page="transfers" onclick="showPage('transfers')"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 7h11l-3-3 1.5-1.5L20 8l-6.5 5.5L12 12l3-3H4zm16 10H9l3 3-1.5 1.5L4 16l6.5-5.5L12 12l-3 3h11z"/></svg></span>اذن تحويل</button>\n  <button id="navInventory" class="nav" data-page="inventory" onclick="requestPage('inventory')"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m12 3 8 4-8 4-8-4zm-8 6 8 4 8-4v9l-8 4-8-4zm3 3v4l4 2v-4z"/></svg></span>المخزون</button>\n  <button id="navSettings" class="nav" data-page="settings" onclick="showPage('settings')"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m9.2 3 1-.4h3.6l1 2.4 2.1 1.2 2.4-.7 1.8 3.1-1.7 1.9v2.4l1.7 1.9-1.8 3.1-2.4-.7-2.1 1.2-1 2.4h-3.6l-1-2.4-2.1-1.2-2.4.7-1.8-3.1 1.7-1.9V10.5L2.9 8.6l1.8-3.1 2.4.7L9.2 5zM12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg></span>الإعدادات</button>\n  <button id="navClients" class="nav" data-page="clients" onclick="showPage('clients')"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 21a6 6 0 0 1 12 0zm11 0a5 5 0 0 1 7 0z"/></svg></span>العملاء</button>\n  <button class="nav logout" onclick="supabaseClient.auth.signOut().finally(()=>location.reload())"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 3h9v4h-2V5H6v14h5v-2h2v4H4zm11 6 2-2 5 5-5 5-2-2 1.6-2H9v-2h7.6z"/></svg></span>تسجيل الخروج</button>\n'''
          s=s[:a]+new+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use matching sidebar icons'
          git push
      - name: Remove this one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/patch-sidebar-icons-once.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time sidebar icon workflow' || true
          git push || true
