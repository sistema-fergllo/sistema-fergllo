name: Fix internal top bar text color

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, 'Auto: make internal top bar text white')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply white text override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* FARAGELLO TOPBAR WHITE TEXT */'
          if marker not in s:
              css = '''\n<style>\n/* FARAGELLO TOPBAR WHITE TEXT */\n#app .top .brand h1,\n#app .top .brand small,\n#app .top .clock,\n#app .top .clock *,\n#app .top .user,\n#app .top .user * { color:#fff !important; }\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: make internal top bar text white"
          git push