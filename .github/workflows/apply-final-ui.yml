name: Apply final Faragello UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* FARAGELLO FINAL UI */'
          if marker not in s:
              css='''\n<style>\n/* FARAGELLO FINAL UI */\n:root{--bg:#f4f8ff;--panel:#ffffff;--panel2:#eef6ff;--blue:#168cff;--cyan:#24b8ff;--green:#18b86a;--red:#ef4b61;--gold:#e3a51b;--text:#0b2a5b;--muted:#6d86a7;--line:#d7e6f6}\nbody{background:#f5f9ff;color:var(--text)}\n.top{height:84px;background:linear-gradient(90deg,#0a2145,#123d72,#0a2145);border-bottom:0;padding:0 28px;box-shadow:0 3px 18px #12345b22}\n.brand{gap:14px}.logo{width:58px;height:58px;border:0;border-radius:14px;background:linear-gradient(145deg,#168cff,#0d4ea3);color:#fff;box-shadow:0 7px 18px #168cff44}\n.brand h1{font-size:27px}.brand small{color:#5bd8ff}.user{background:#0a2145;border:1px solid #3976ac}.clock{color:#e9f4ff}\n.layout{min-height:calc(100vh - 84px)}.side{width:250px;background:linear-gradient(180deg,#061c3d,#07152c);border-left:0;padding:22px 14px;gap:8px;box-shadow:4px 0 18px #0a2a5220}\n.nav{padding:14px 16px;border-radius:12px;color:#e9f4ff;font-size:16px}.nav:hover,.nav.active{background:linear-gradient(90deg,#168cff,#1165c0);border-color:#43baff;box-shadow:0 8px 18px #168cff33}.nav-icon{width:30px;height:30px}.nav-icon svg{width:24px;height:24px}.logout{background:#3a1725;border-color:#6e263a}\nmain{padding:28px;background:radial-gradient(circle at 0 0,#e8f4ff 0,#f7fbff 35%,#fff 75%)}.page{max-width:1450px}.title h2{color:#0b2a5b}.sub{color:#7289a8}.cards{gap:18px}.card{background:#fff;border:1px solid #d9e8f7;border-radius:16px;box-shadow:0 8px 24px #1c4d7d10}.card .label{color:#6682a5}.table-wrap,.cash-panel,.toolbar{background:#fff;border:1px solid #d9e8f7;box-shadow:0 8px 24px #1c4d7d0d}.table th{background:#edf6ff;color:#174779;border-bottom:1px solid #d5e6f5}.table td{color:#1b3b62;border-bottom:1px solid #e3edf7}.table tr:hover td{background:#f5faff}.toolbar input,.toolbar select,.modal input,.cash-search,.scan input,.paybox select,.paybox input{background:#fff;color:#173b64;border-color:#c9dced}.btn{box-shadow:0 5px 12px #168cff22}\n#home .cash-panel{background:transparent;border:0;box-shadow:none;text-align:center;padding:45px 20px 20px;position:relative;overflow:hidden}\n#home .cash-panel h3{font-size:34px;color:#0b2a5b;margin:20px 0 10px}\n#home .cash-panel .sub{font-size:18px}\n#home .cash-panel:before{content:'⌗';display:grid;place-items:center;margin:0 auto;width:135px;height:135px;border-radius:26px;background:linear-gradient(145deg,#168cff,#123e8d);color:#fff;font-size:75px;font-weight:bold;box-shadow:0 18px 35px #168cff33}\n#home .cash-panel:after{content:'Faragello  System';display:block;color:#168cff;font-size:28px;font-weight:bold;margin-top:16px;letter-spacing:1px}\n@media(max-width:900px){.side{width:76px}.nav{font-size:0}.nav-icon{margin:0}.top{padding:0 12px}.brand h1{font-size:20px}}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)
          start=s.find('<div id="home" class="page">')
          end=s.find('<div id="inventory" class="page hidden">',start)
          if start<0 or end<0:
              raise SystemExit('home/inventory markers not found')
          home='''<div id="home" class="page"><div id="clientWorkspaceBar" class="cash-panel" style="margin-bottom:16px;display:none;border-color:#21d46b"><b>مساحة عمل العميل:</b> <span id="clientWorkspaceName"></span> <button class="btn gray" style="float:left" onclick="leaveClientWorkspace()">↩ العودة للعملاء</button></div><div class="title"><div><h2>لوحة التحكم</h2><div class="sub">إدارة أسهل .. مبيعات أعلى .. نجاح أكبر</div></div></div><div class="cash-panel"><h3>مرحباً بك في نظام فرجللو</h3><div class="sub">نظام متكامل لإدارة المخزون والكاشير والمبيعات والتقارير</div></div><div class="cards"><div class="card"><div class="label">العملاء</div><div id="cItems" class="value cyan">0</div></div><div class="card"><div class="label">المخزون</div><div id="cQty" class="value green">0</div></div><div class="card"><div class="label">المبيعات</div><div id="cSales" class="value gold">0</div></div><div class="card"><div class="label">التقارير</div><div id="cStock" class="value">0</div></div></div></div>\n'''
          s=s[:start]+home+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply final Faragello dashboard UI'
          git push
      - name: Remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-final-ui.yml
          git add .github/workflows/apply-final-ui.yml
          git commit -m 'Remove one-time UI workflow'
          git push
