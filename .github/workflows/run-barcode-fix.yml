name: Apply barcode first-label fix
on:
  push:
    paths:
      - '.github/barcode-fix-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch barcode printing
        run: python3 scripts/fix_blank_first_barcode.py
      - name: Commit patched index
        run: |
          git config user.name 'Faragello Bot'
          git config user.email 'actions@github.com'
          git add index.html scripts/fix_blank_first_barcode.py .github/workflows/run-barcode-fix.yml .github/barcode-fix-trigger.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix barcode printing first label without blank feed'
          git push
