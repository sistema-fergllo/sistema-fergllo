name: Apply Faragello new design
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  redesign:
    if: github.event.head_commit.message != 'Apply Faragello image design' && github.event.head_commit.message != 'Fix Faragello image paths'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reference images
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/login.jpg','login_web.jpg')
          s=s.replace('assets/dashboard.jpg','dashboard_web.jpg')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit design
        run: |
          git config user.name "sistema-fergllo"
          git config user.email "farajelsayed1@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply exact Faragello reference images"
          git push
