name: Apply Faragello exact reference design
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact reference design is present
        run: |
          test -f index.html
          test -f force-design.css
          grep -q 'force-design.css' index.html
          echo "Faragello reference design is present."
