name: Fix barcode print orientation
on:
  push:
    paths:
      - 'scripts/fix_barcode_print_orientation.py'
      - '.github/barcode-orientation-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 scripts/fix_barcode_print_orientation.py
      - name: Commit patched index
        run: |
          git config user.name 'Faragello Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix barcode visibility and landscape label printing'
          git push
