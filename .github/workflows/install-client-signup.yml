name: Install client signup flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[client-signup-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject client signup script into main HTML
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="client-signup.js"></script>'
          # Remove any previous accidental copies, including one embedded in a generated print string.
          s=s.replace(tag+'\n','').replace(tag,'')
          marker='</body>'
          if marker not in s:
              raise SystemExit('index.html has no </body> marker')
          s=s.rsplit(marker,1)[0] + tag + '\n' + marker + s.rsplit(marker,1)[1]
          p.write_text(s, encoding='utf-8')
      - name: Commit injection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix client signup script injection [client-signup-installed]'
          git push
