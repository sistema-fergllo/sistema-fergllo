name: Repair Faragello login and cache
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify login and cache-busting stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=["async function doLogin()","selectedLoginRole==='admin'","user_profiles","force-design.css"]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing login/design components: '+', '.join(missing))
          print('Login and design verification passed.')
          PY
